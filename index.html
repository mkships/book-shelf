<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf — find and save your favorite books</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="index.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="brand">Book<span class="brand__mark">Shelf</span></span>
      <span class="tagline">Find a book. Add it to your shelf. Track your reading.</span>
    </div>
  </header>

  <main>
    <!-- SEARCH: user searches for books by entering a search term -->
    <form id="searchForm" class="search">
      <label class="search__label" for="searchInput">Search for a book</label>
      <div class="search__row">
        <input
          type="text"
          id="searchInput"
          class="search__input"
          placeholder="Try a title or author — e.g. Dune, Stephen King, Animal Farm"
          autocomplete="off"
        >
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <!-- TABS: switch between search results and the saved shelf -->
    <div class="tablist" role="tablist" aria-label="Bookshelf views">
      <button type="button" class="tab" id="tab-results" role="tab" aria-selected="true" aria-controls="panel-results">
        Search results
      </button>
      <button type="button" class="tab" id="tab-shelf" role="tab" aria-selected="false" aria-controls="panel-shelf" tabindex="-1">
        My shelf <span id="shelfCount" class="tab__count">0</span>
      </button>
    </div>

    <!-- RESULTS: search results render like cards -->
    <section class="section" id="panel-results" role="tabpanel" aria-labelledby="tab-results">
      <!-- Show "Searching…", "No books found.", or an error message here -->
      <p id="searchStatus" class="status"></p>

      <div id="searchResults" class="book-grid">
        <!-- Empty state to show when there are no results yet: -->
        <div class="empty">Search for a book above to start building your shelf.</div>
      </div>
    </section>

    <!-- MY SHELF: user's saved readlist[] renders here -->
    <section class="section" id="panel-shelf" role="tabpanel" aria-labelledby="tab-shelf" hidden>
      <div id="readlist" class="book-grid">
        <!-- Empty state to show when the shelf is empty -->
        <div class="empty">Your shelf is empty — add books from the search results above.</div>
      </div>
    </section>
  </main>
  
</body>
</html>
